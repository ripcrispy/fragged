# Fragged behind nginx (TLS via certbot or your own certificates).
# Several app instances: list them in the upstream; they share state through PostgreSQL.
upstream fragged {
    server 127.0.0.1:3000;
    # server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name forums.example.org;
    # ssl_certificate     /etc/letsencrypt/live/forums.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/forums.example.org/privkey.pem;

    client_max_body_size 12m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Server-Sent Events: no buffering, long-lived
    location = /api/events {
        proxy_pass http://fragged;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / { proxy_pass http://fragged; }
}

server {
    listen 80;
    server_name forums.example.org;
    return 301 https://$host$request_uri;
}
